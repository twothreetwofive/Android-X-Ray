[pytest]
# src/를 import 경로에 넣어서 tests에서 `from static_analyzer import ...`가 되게 한다.
# (pytest 7 이상의 pythonpath 옵션. 별도 conftest.py에서 sys.path를 건드릴 필요 없음)
# 저장소 루트(.)도 넣는다 — 7주차 대시보드의 common.py / views/가 루트에 있어서
# `from common import safe_get`, `from views.static_data import ...`가 되게 하려는 것.
# app.py도 같은 기준(루트에서 `streamlit run app.py`)으로 import한다.
pythonpath = src .
testpaths = tests
